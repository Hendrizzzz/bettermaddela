<?xml version="1.0" encoding="UTF-8"?>
<!--
  BetterMaddela identity mark - original vector work for this project (2026-08).
  Direction contract ("Golden Hour"):
  THESIS: Maddela at sunrise - harvest gold light rising exactly between two
  limestone gorge walls, its reflection on the Cagayan River. No letterform,
  no app-icon tile, no seal, no borrowed motifs.
  OWN-WORLD: warm charcoal ink #221D14, harvest gold #F5B301, paper #FFFCF4.
  Anchors: research/2026-08-identity-brief (corn/rice gold, dawn light, river
  and limestone landscape). Independent project - never an official seal.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="8" y="8" width="11" height="48" rx="5.5" fill="#221d14"/>
  <rect x="45" y="8" width="11" height="48" rx="5.5" fill="#221d14"/>
  <circle cx="32" cy="30" r="13" fill="#f5b301"/>
  <rect x="21" y="50" width="10" height="5" rx="2.5" fill="#f5b301"/>
  <rect x="33" y="50" width="10" height="5" rx="2.5" fill="#f5b301" opacity="0.55"/>
</svg>
